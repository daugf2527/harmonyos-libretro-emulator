name: Feature request
description: Propose a product or engineering improvement
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user or engineering problem should this solve
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
      description: Describe the expected behavior, not just an implementation guess
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope and constraints
      description: Constraints around compatibility, release policy, asset policy, or architecture
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Any smaller or simpler alternatives
