<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport"/>
<title>Ultimate Virtual Controller - TELEMETRY_v1.0.4</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Space+Grotesk:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              "primary": "#00e639",
              "on-primary": "#004c0c",
              "surface": "#0e0e0e",
              "on-surface": "#e5e5e5",
              "outline-variant": "#484848",
            },
            fontFamily: {
              "headline": ["Space Grotesk", "Inter", "sans-serif"],
              "body": ["Inter", "sans-serif"],
              "label": ["Inter", "sans-serif"]
            },
            borderRadius: {"DEFAULT": "0.125rem", "lg": "0.25rem", "xl": "0.5rem", "full": "0.75rem"},
          },
        },
      }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: "FILL" 0, "wght" 400, "GRAD" 0, "opsz" 24
        }
        .glass-panel {
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(12px);
            border: 0.5px solid rgba(255, 255, 255, 0.1)
        }
        .pixel-bg {
            background-image: url(https://lh3.googleusercontent.com/aida-public/AB6AXuDIQPRjWoDph672LCz-zY0-HIkAovHj-7-pe4Ds0liWmwApDlBZf2rdKmlp8G4PjseQJwQQlBk9Xi7pHaexgl0JgQqoPi3BXUWqBzoi4tzsf0CxuGtoOFTAC3No7b54aqAtcXVhdrgR7pprsEA66F-Z0DlTtla7BSZ8njEkhORDzo9IZzSXIStC1-jA8kBlids9q_W4QvnWlGJ8A1MoahELFX8s3J_DPkQv7x1S19GgF2Z1cWdPe7xWVYO4ZlqKOIY5e0kr2m81rA);
            background-size: cover;
            background-position: center;
            filter: contrast(1.2) brightness(0.6) saturate(1.4)
        }
        /* Enhanced Green Glow Feedback */
        .btn-glow-feedback {
            transition: all 0.1s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .btn-glow-feedback:active {
            box-shadow: 0 0 20px rgba(0, 230, 57, 0.6) inset, 0 0 15px rgba(0, 230, 57, 0.4);
            transform: scale(0.92);
            border-color: #00e639;
        }
        .dpad-btn {
            @apply w-12 h-12 flex items-center justify-center border-[0.5px] border-outline-variant bg-black/40 btn-glow-feedback;
        }
        .action-btn {
            @apply w-14 h-14 rounded-full flex flex-col items-center justify-center border-[0.5px] border-outline-variant bg-black/60 btn-glow-feedback;
        }
        body {
            min-height: max(884px, 100dvh);
        }
        #telemetry-bar {
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.3s ease;
        }
        #telemetry-bar.hidden-telemetry {
            transform: translateY(-100%);
            opacity: 0;
            pointer-events: none;
        }
        @keyframes float-up {
            0% { transform: translate(-50%, 0); opacity: 0; }
            20% { transform: translate(-50%, -20px); opacity: 1; }
            80% { transform: translate(-50%, -40px); opacity: 1; }
            100% { transform: translate(-50%, -60px); opacity: 0; }
        }
        .success-bubble {
            animation: float-up 1.5s ease-out forwards;
        }
    </style>
</head>
<body class="bg-black text-on-surface font-body overflow-hidden h-screen select-none">
<!-- Retro Pixel Art Background Layer -->
<div class="fixed inset-0 pixel-bg z-0" data-alt="vibrant retro 16-bit pixel art style game background showing a futuristic city street at night with neon signs and flying vehicles"></div>
<div class="fixed inset-0 bg-black/40 z-1"></div>
<!-- Top Monitor Bar: Compact High-Precision Stats -->
<header class="fixed top-0 w-full h-10 bg-black/85 backdrop-blur-md flex justify-between items-center px-4 z-50 border-b-[0.5px] border-[#484848]/40">
<div class="flex items-center gap-2">
<span class="material-symbols-outlined text-[#00FF41] text-xs">memory</span>
<span class="text-[#00FF41] font-mono font-bold tracking-[0.1em] text-[10px]">TELEMETRY_v1.0.4</span>
</div>
<div class="flex gap-4 items-center" id="telemetry-bar">
<div class="flex gap-3 font-mono text-[10px]">
<div class="flex flex-col items-start leading-none">
<span class="text-[7px] text-zinc-500 uppercase font-bold mb-0.5">FPS</span>
<span class="text-[#00FF41]" id="fps-val">60.0</span>
</div>
<div class="flex flex-col items-start leading-none">
<span class="text-[7px] text-zinc-500 uppercase font-bold mb-0.5">LAT</span>
<span class="text-[#00FF41]" id="lat-val">4ms</span>
</div>
</div>
<div class="h-4 w-[1px] bg-outline-variant/30"></div>
<div class="flex flex-col items-start leading-none">
<span class="text-[7px] text-zinc-500 uppercase font-bold mb-0.5">CORE</span>
<span class="text-[#00FF41] font-mono text-[10px]">EMU_V26</span>
</div>
</div>
<button class="material-symbols-outlined text-[#00FF41] text-base hover:bg-zinc-900 p-1 rounded-full transition-colors duration-150 active:scale-95" onclick="toggleTelemetry()">
        visibility_off
    </button>
</header>
<!-- Main Controller Canvas -->
<main class="relative z-10 w-full h-full flex items-center justify-between px-8 md:px-16 pt-10 pb-16">
<!-- Left: D-Pad Control Module -->
<div class="flex flex-col items-center justify-center">
<div class="glass-panel p-6 rounded-xl flex flex-col items-center">
<div class="grid grid-cols-3 gap-1">
<div></div>
<button class="dpad-btn rounded-t-lg"><span class="material-symbols-outlined">arrow_drop_up</span></button>
<div></div>
<button class="dpad-btn rounded-l-lg"><span class="material-symbols-outlined">arrow_left</span></button>
<div class="w-12 h-12 bg-zinc-900/50 flex items-center justify-center border-[0.5px] border-outline-variant/20">
<div class="w-2 h-2 bg-[#00FF41]/40 rounded-full"></div>
</div>
<button class="dpad-btn rounded-r-lg"><span class="material-symbols-outlined">arrow_right</span></button>
<div></div>
<button class="dpad-btn rounded-b-lg"><span class="material-symbols-outlined">arrow_drop_down</span></button>
<div></div>
</div>
<div class="mt-4 text-[9px] font-mono text-zinc-500 tracking-[0.3em] uppercase">Movement</div>
</div>
</div>
<!-- Center: System Status -->
<div class="hidden lg:flex flex-col items-center justify-center w-64 glass-panel p-4 rounded-lg">
<div class="w-full border-b border-outline-variant/30 pb-2 mb-3 flex justify-between items-center">
<span class="text-[10px] text-zinc-400 font-bold tracking-tighter">ROM_LOAD_SUCCESS</span>
<span class="w-1.5 h-1.5 bg-[#00FF41] rounded-full animate-pulse"></span>
</div>
<div class="space-y-2 w-full">
<div class="flex justify-between text-[11px] font-mono">
<span class="text-zinc-500">MAPPING:</span>
<span class="text-on-surface">DEFAULT_HID</span>
</div>
<div class="flex justify-between text-[11px] font-mono">
<span class="text-zinc-500">VIBRATION:</span>
<span class="text-[#00FF41]">ACTIVE</span>
</div>
<div class="mt-4 h-[1px] bg-gradient-to-r from-transparent via-outline-variant/40 to-transparent"></div>
<div class="text-center pt-2">
<span class="text-[9px] text-zinc-500 uppercase">Input Buffer</span>
<div class="flex gap-0.5 justify-center mt-1">
<div class="h-1 w-3 bg-[#00FF41]"></div>
<div class="h-1 w-3 bg-[#00FF41]"></div>
<div class="h-1 w-3 bg-zinc-800"></div>
<div class="h-1 w-3 bg-zinc-800"></div>
<div class="h-1 w-3 bg-zinc-800"></div>
</div>
</div>
</div>
</div>
<!-- Right: Action Buttons Module -->
<div class="flex flex-col items-center justify-center">
<div class="glass-panel p-8 rounded-xl">
<div class="relative w-40 h-40">
<!-- Y Button -->
<button class="action-btn absolute top-0 left-1/2 -translate-x-1/2">
<span class="text-lg font-bold font-headline">Y</span>
</button>
<!-- X Button -->
<button class="action-btn absolute left-0 top-1/2 -translate-y-1/2">
<span class="text-lg font-bold font-headline">X</span>
</button>
<!-- B Button (Back) -->
<button class="action-btn absolute right-0 top-1/2 -translate-y-1/2 border-red-500/30">
<span class="text-lg font-bold font-headline">B</span>
<span class="text-[8px] text-red-400/80 mt-0.5">返回 (Back)</span>
</button>
<!-- A Button (Confirm) -->
<button class="action-btn absolute bottom-0 left-1/2 -translate-x-1/2 border-primary/50 text-[#00FF41]">
<span class="text-lg font-bold font-headline">A</span>
<span class="text-[8px] text-[#00FF41]/70 mt-0.5">确认 (Confirm)</span>
</button>
</div>
</div>
</div>
</main>
<!-- Permanent Quick Save Button (Right-side Resident) -->
<div class="fixed right-6 top-1/2 -translate-y-1/2 z-40 touch-none" id="quick-save-container">
<button class="glass-panel px-4 py-6 rounded-full flex flex-col items-center gap-3 border-primary shadow-[0_0_20px_rgba(0,255,65,0.2)] active:scale-90 transition-all cursor-move" id="quick-save-btn" onclick="handleQuickSave(event)">
<span class="material-symbols-outlined text-[#00FF41] text-2xl" style="font-variation-settings: 'FILL' 1;">save</span>
<div class="[writing-mode:vertical-lr] text-[10px] tracking-[0.2em] font-bold text-primary uppercase">
            QUICK SAVE
        </div>
</button>
<!-- Feedback Bubble Anchor -->
<div class="absolute left-[-60px] top-1/2 -translate-y-1/2" id="feedback-anchor"></div>
</div>
<!-- System Triggers (Center Bottom) -->
<div class="fixed bottom-24 left-1/2 -translate-x-1/2 z-40 flex gap-4">
<button class="glass-panel px-6 py-2 rounded-md flex items-center gap-2 border-outline-variant/40 active:bg-zinc-800 btn-glow-feedback">
<span class="text-[10px] font-mono text-zinc-400">SELECT</span>
</button>
<button class="glass-panel px-6 py-2 rounded-md flex items-center gap-2 border-outline-variant/40 active:bg-zinc-800 btn-glow-feedback">
<span class="text-[10px] font-mono text-zinc-400">START</span>
</button>
</div>
<!-- Bottom Navigation Bar -->
<nav class="bg-black text-[#00FF41] fixed bottom-0 w-full z-50 border-t border-zinc-900 flex justify-around items-center h-20 pb-safe px-4">
<div class="flex flex-col items-center justify-center text-zinc-600 hover:text-zinc-300 transition-colors cursor-pointer group">
<span class="material-symbols-outlined mb-1 group-active:scale-90" data-icon="grid_view">grid_view</span>
<span class="font-['Inter'] text-[10px] font-medium tracking-widest uppercase">LIBRARY</span>
</div>
<div class="flex flex-col items-center justify-center text-zinc-600 hover:text-zinc-300 transition-colors cursor-pointer group">
<span class="material-symbols-outlined mb-1 group-active:scale-90" data-icon="terminal">terminal</span>
<span class="font-['Inter'] text-[10px] font-medium tracking-widest uppercase">ENGINE</span>
</div>
<div class="flex flex-col items-center justify-center text-zinc-600 hover:text-zinc-300 transition-colors cursor-pointer group">
<span class="material-symbols-outlined mb-1 group-active:scale-90" data-icon="sports_esports">sports_esports</span>
<span class="font-['Inter'] text-[10px] font-medium tracking-widest uppercase">INPUT</span>
</div>
<div class="flex flex-col items-center justify-center text-[#00FF41] relative after:content-[''] after:absolute after:top-0 after:w-1 after:h-1 after:bg-[#00FF41] after:rounded-full cursor-pointer group">
<span class="material-symbols-outlined mb-1 group-active:scale-90" data-icon="tune" style="font-variation-settings: 'FILL' 1;">tune</span>
<span class="font-['Inter'] text-[10px] font-medium tracking-widest uppercase">SYSTEM</span>
</div>
</nav>
<!-- Scanline/Vignette Overlay -->
<div class="fixed inset-0 pointer-events-none z-[60] bg-[linear-gradient(rgba(18,16,16,0)_50%,rgba(0,0,0,0.1)_50%),linear-gradient(90deg,rgba(255,0,0,0.03),rgba(0,255,0,0.01),rgba(0,0,255,0.03))] bg-[length:100%_2px,3px_100%] opacity-20"></div>
<script>
    // Telemetry Toggle
    function toggleTelemetry() {
        const bar = document.getElementById('telemetry-bar');
        const btn = event.currentTarget;
        const isHidden = bar.classList.toggle('hidden-telemetry');
        btn.textContent = isHidden ? 'visibility' : 'visibility_off';
    }

    // Quick Save Feedback
    function handleQuickSave(e) {
        const anchor = document.getElementById('feedback-anchor');
        const bubble = document.createElement('div');
        bubble.className = 'success-bubble absolute whitespace-nowrap bg-[#00FF41] text-black text-[10px] font-bold px-2 py-1 rounded shadow-lg pointer-events-none flex items-center gap-1';
        bubble.innerHTML = '<span class="material-symbols-outlined text-[12px]">check_circle</span> SAVED';
        anchor.appendChild(bubble);
        
        setTimeout(() => bubble.remove(), 1500);
        if (window.navigator.vibrate) window.navigator.vibrate(50);
    }

    // Basic Draggable Logic for Quick Save
    const dragItem = document.getElementById("quick-save-container");
    let active = false;
    let currentX;
    let currentY;
    let initialX;
    let initialY;
    let xOffset = 0;
    let yOffset = 0;

    dragItem.addEventListener("touchstart", dragStart, false);
    document.addEventListener("touchend", dragEnd, false);
    document.addEventListener("touchmove", drag, false);

    dragItem.addEventListener("mousedown", dragStart, false);
    document.addEventListener("mouseup", dragEnd, false);
    document.addEventListener("mousemove", drag, false);

    function dragStart(e) {
        if (e.type === "touchstart") {
            initialX = e.touches[0].clientX - xOffset;
            initialY = e.touches[0].clientY - yOffset;
        } else {
            initialX = e.clientX - xOffset;
            initialY = e.clientY - yOffset;
        }

        if (e.target === document.getElementById("quick-save-btn") || e.target.parentNode === document.getElementById("quick-save-btn") || e.target.parentNode.parentNode === document.getElementById("quick-save-btn")) {
            active = true;
        }
    }

    function dragEnd(e) {
        initialX = currentX;
        initialY = currentY;
        active = false;
    }

    function drag(e) {
        if (active) {
            e.preventDefault();
            if (e.type === "touchmove") {
                currentX = e.touches[0].clientX - initialX;
                currentY = e.touches[0].clientY - initialY;
            } else {
                currentX = e.clientX - initialX;
                currentY = e.clientY - initialY;
            }
            xOffset = currentX;
            yOffset = currentY;
            setTranslate(currentX, currentY, dragItem);
        }
    }

    function setTranslate(xPos, yPos, el) {
        el.style.transform = "translate3d(" + xPos + "px, calc(-50% + " + yPos + "px), 0)";
    }

    // Mock telemetry updates
    setInterval(() => {
        const fps = (59 + Math.random()).toFixed(1);
        const lat = Math.floor(Math.random() * 3) + 3;
        document.getElementById('fps-val').innerText = fps;
        document.getElementById('lat-val').innerText = lat + 'ms';
    }, 1500);
</script>
</body></html>
