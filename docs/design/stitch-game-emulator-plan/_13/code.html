<style>
        .material-symbols-outlined {

        }
        body {
            background-color: #000000;
            color: #e5e5e5;
        }
        /* Custom pixel-art style for the empty slot */
        .pixel-slot {
            width: 120px;
            height: 140px;
            border: 2px solid #262626;
            position: relative;
            background: linear-gradient(135deg, #0e0e0e 0%, #000000 100%);
        }
        .pixel-slot::after {
            content: '';
            position: absolute;
            top: 15px;
            left: 15px;
            right: 15px;
            bottom: 40px;
            border: 1px dashed #484848;
        }
        .progress-line {
            height: 2px;
            background: #1a1a1a;
            width: 100%;
            position: relative;
            overflow: hidden;
        }
        .progress-fill {
            position: absolute;
            height: 100%;
            background: #00e639;
            width: 0%;
            transition: width 0.3s ease;
        }

        /* Particle Background Effects */
        #particle-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }

<body class="font-body selection:bg-primary-container selection:text-on-primary-container overflow-hidden">
<canvas id="particle-canvas"></canvas>

<!-- Main Content Canvas -->

<div class="border-r border-outline-variant h-full"></div>
<div class="border-r border-outline-variant h-full"></div>
<div class="border-r border-outline-variant h-full"></div>
<div class="border-r border-outline-variant h-full"></div>
<div class="border-r border-outline-variant h-full"></div>
<div class="border-r border-outline-variant h-full"></div>
<div class="border-r border-outline-variant h-full"></div>
<div class="border-r border-outline-variant h-full"></div>
<div class="border-r border-outline-variant h-full"></div>
<div class="border-r border-outline-variant h-full"></div>
<div class="border-r border-outline-variant h-full"></div>
</div>
</div>
<!-- Empty State Container -->
<div class="z-10 flex flex-col items-center max-w-md w-full animate-in fade-in zoom-in duration-500" id="empty-state">
<!-- Pixel Illustration -->

<!-- Copy -->

<p class="text-on-surface-variant font-body text-sm text-center mb-10 leading-relaxed max-w-xs">

<!-- Visual Polish: Vignette Overlay -->
<div class="fixed inset-0 pointer-events-none bg-[radial-gradient(circle_at_center,transparent_0%,rgba(0,0,0,0.4)_100%)] z-20"></div>
<script>
    // Particle System
    const canvas = document.getElementById('particle-canvas');
    const ctx = canvas.getContext('2d');
    let particles = [];
    let particleSpeedMultiplier = 1;

    function initParticles() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        particles = [];
        for (let i = 0; i < 50; i++) {
            particles.push({
                x: Math.random() * canvas.width,
                y: Math.random() * canvas.height,
                size: Math.random() * 2 + 1,
                speedX: (Math.random() - 0.5) * 0.5,
                speedY: (Math.random() - 0.5) * 0.5,
                opacity: Math.random() * 0.5
            });
        }
    }

    function animateParticles() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        particles.forEach(p => {
            p.x += p.speedX * particleSpeedMultiplier;
            p.y += p.speedY * particleSpeedMultiplier;

            if (p.x < 0) p.x = canvas.width;
            if (p.x > canvas.width) p.x = 0;
            if (p.y < 0) p.y = canvas.height;
            if (p.y > canvas.height) p.y = 0;

            ctx.fillStyle = `rgba(0, 230, 57, ${p.opacity})`;
            // Pixelated square particles
            ctx.fillRect(p.x, p.y, p.size, p.size);
        });
        requestAnimationFrame(animateParticles);
    }

    window.addEventListener('resize', initParticles);
    initParticles();
    animateParticles();

    function startImport() {
        const progressContainer = document.getElementById('inline-scan-progress');
        const bar = document.getElementById('scan-bar-fill');
        const text = document.getElementById('scan-percentage');
        const button = document.getElementById('import-button');
        const cpuText = document.getElementById('cpu-status');

        progressContainer.classList.remove('hidden');
        button.classList.add('opacity-50', 'pointer-events-none');
        
        // Increase "launch" feel
        particleSpeedMultiplier = 5;
        
        let width = 0;
        const interval = setInterval(() => {
            if (width >= 100) {
                clearInterval(interval);
                document.getElementById('scan-status-text').innerText = "扫描完成";
                setTimeout(() => {
                    particleSpeedMultiplier = 1;
                    // Reset or transition to next screen logic
                }, 1000);
            } else {
                width += Math.random() * 3;
                if (width > 100) width = 100;
                bar.style.width = width + '%';
                text.innerText = Math.floor(width) + '%';
                
                // Telemetry update
                if (cpuText) {
                    cpuText.innerText = `BUSY ${(10 + Math.random() * 40).toFixed(2)}%`;
                }
            }
        }, 80);
    }
</script>
